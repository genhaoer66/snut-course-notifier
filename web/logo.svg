<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="我的课表">
  <!--
    站点 Logo / favicon 的唯一矢量源文件。
    web/favicon.svg（浅色、带圆角与高光）与 web/favicon.ico（多尺寸）
    都由它导出：python scripts/make_brand_assets.py

    造型 = 站内 header 那个 #i-whale 标记的放大重绘：
      背脊一笔（鲸鱼身体） + 两道水/跑道线。
    取含义：鲸鱼是 "course" 的谐音记号，也是当前 favicon 那个内联 SVG 的形状，
    换图标时浏览器书签栏里看到的还是同一个记号，不会变成陌生图案。

    配色取自 style.css 的 .brand-mark 渐变（oklch 34%/.130/268 → 56%/.150/264），
    这里换成等价的 sRGB 十六进制，因为 <link rel="icon"> 的 SVG 要能独立渲染。

    两条硬约束，改图时不要破坏：
      1. 鲸鱼整体落在 r=15 的圆内（圆心 32,32），圆角方块的切角离它很远，
         16×16 缩小后不会贴边、不会被圆角吃掉笔画。
      2. 只用 2 条路径 + 线宽 ≥ 3.4，保证 16px 下三笔仍然分开。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#203170"/>
      <stop offset="1" stop-color="#4a63c0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 底板：圆角方块 + 顶部一道极淡的高光，用来呼应站内玻璃材质 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#sheen)"/>

  <!-- 鲸鱼身体：背部隆起 + 腹部收两条流线，几何化到一笔 -->
  <path fill="#ffffff" fill-opacity=".95"
        d="M17 28.6c8.1 0 12.6-3.2 15-11.3 2.4 8.1 6.9 11.3 15 11.3 1.9 0 3.5-.3 4.8-1-1.1 9.9-9.1 17.1-19.8 17.1-10.9 0-19-7.1-20-16.1z"/>

  <!-- 水线 / 肚皮线：一道短弧，宽度够粗才不会在 16px 下糊成一团 -->
  <path fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="3.4" stroke-linecap="round"
        d="M20.5 40.2c6.6 1.8 18.4 1.8 24 0"/>
</svg>
